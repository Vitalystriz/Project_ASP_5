version: '3.8'

services:
  # C++ TCP-servr
  server:
    build:
      context: ./ass2Server
      dockerfile: Dockerfile
      target: runtime # get a
    container_name: recommendation_server
    expose:
      - "8080"
    volumes:
      - ./ass2Server/data:/app/ass2Server/data # equals to -v "${PWD}/data:/app/data" recommendation-app
    command: ["./RecommendationApp", "8080"] # CHANGE IT HERE passing the port as an arg to main

  # API_JS
  api_js:
    build:
      context: ./node-backend
      dockerfile: API_JS.Dockerfile
    container_name: api_js
    depends_on:
      - server # First of all server and then client
    ports:
      - "5000:5000"
    environment:
      - BACKEND_HOST=server
      - BACKEND_PORT=8080

    # React Frontend
  react:
    build:
      context: ./react-frontend
      dockerfile: React.Dockerfile
    container_name: react
    depends_on:
      - api_js
    ports:
      - "3000:3000"

